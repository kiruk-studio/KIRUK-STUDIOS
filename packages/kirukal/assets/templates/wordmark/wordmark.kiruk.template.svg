<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 312" width="1024" height="312">
  <!--
    kiruk drawing template — wordmark.kiruk
    Draw INSIDE this frame. Everything in #guides is stripped on import, so you
    never need to hide or delete a layer.
    Brush: 3 units (the swatch below the frame is exactly this weight).
    Colour: pure black on transparent. Import rewrites it to currentColor.
  -->
  <g id="guides" data-kirukal="guide" stroke="#FF00FF" stroke-width="1" fill="none" opacity="0.85">
    <path d="M 0 0 h 10" />
    <path d="M 0 0 v 10" />
    <path d="M 1024 0 h -10" />
    <path d="M 1024 0 v 10" />
    <path d="M 1024 256 h -10" />
    <path d="M 1024 256 v -10" />
    <path d="M 0 256 h 10" />
    <path d="M 0 256 v -10" />
    <rect x="32" y="32" width="960" height="192" fill="none" stroke-dasharray="8 8" />
    <path d="M 82 284 h 184" stroke-width="3" stroke-dasharray="none" />
  </g>
  <g id="artwork" data-kirukal="artwork">
    <!-- your strokes go here -->
  </g>
</svg>
