  /* ---- pen.md helpers, pasted as written ---- */
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    const len = path.getTotalLength();

    const lh = Math.hypot(...light);
    const [lx, ly] = [light[0] / lh, light[1] / lh];
    const pts = [];

      const q = path.getPointAtLength(Math.min(len, t + 0.5));
      const r = path.getPointAtLength(Math.max(0, t - 0.5));
      const d = Math.hypot(q.x - r.x, q.y - r.y) || 1;
      const [ox, oy] = [(side * (q.y - r.y)) / d, (side * -(q.x - r.x)) / d];

    const [cx, cy, r] = [x + w / 2, y + h / 2, Math.hypot(w, h) / 2];
    const ff = (v) => v.toFixed(1);

    for (let t = -r; t <= r; t += gap * (0.9 + 0.2 * rand())) {

    const band = groundPts.concat(arc(m, thR, thL, -C.band / m.V));
    const fade = el(dg, 'radialGradient', { id: `fade-${id}`, gradientUnits: 'userSpaceOnUse', cx: f(O[0]), cy: f(O[1]), r: f(C.fadeR) });
    el(fade, 'stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 1 });
    el(fade, 'stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0.3 });
    const fm = el(dg, 'mask', { id: `fadem-${id}`, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: C.w, height: C.h });
    el(fm, 'rect', { x: 0, y: 0, width: C.w, height: C.h, fill: `url(#fade-${id})` });
    el(subj, 'path', { class: 'ink-fill', 'clip-path': clipTo(dg, `crust-${id}`, pathOf(band, true)), mask: `url(#fadem-${id})`, d: hatch(bounds(band), { gap: 4.4 * s, weight: 0.8, reach: 0.42, seed: 11, toward: [0.2, -1] }) });
    // The ground: one quill stroke, thin on the day side where the sun still reaches it, heavy into the night.
    qpath(subj, pathOf(groundPts), { min: 0.8, max: 2.6 * s, light: m.toSun, side: 1, seed: 3 });
    for (const [i, th] of [thL, thR].entries()) qpath(subj, pathOf([m.polar(th, 0.2 / m.V), m.polar(th, -C.band / m.V)]), { min: 0.9, max: 1.4, seed: 30 + i });
    // Sunlight: B and the thin layer of rays above it, entering at the slice's east cut; past the top of the air
    // each goes on unseen a little way and the pen lifts.
    for (const [i, q] of C.rays.entries()) {
      const s0 = (R + q) * Math.tan((d + thL) * rad);
      const s1 = q < 0 ? -Math.sqrt(R * R - (R + q) ** 2) : m.shell(q, TOP);
      const pa = m.ray(q, s0), pb = m.ray(q, s1);
      const main = q === 0 ? { min: 1.0 * s, max: 2.1 * s } : { min: 0.55, max: 1.25 * s };
      qpath(subj, pathOf([pa, pb]), { ...main, light: [0, -1], side: -1, seed: 50 + i, step: 3 });
      if (q >= 0) {
        const pc = m.ray(q, s1 + C.beyond / m.S);
        qpath(subj, pathOf([pb, pc]), { min: 0.4, max: 0.9 * s, light: [0, -1], side: -1, seed: 60 + i, step: 3 }, { class: 'ink-fill ink-faint' });
      }
    }
    // A: the sun, drawn for its direction only; a break mark says it is far off the sheet.
    const [sx, sy, sr] = C.sun;
    qpath(subj, circlePath(sx, sy, sr), { min: 0.7, max: 1.9 * s, seed: 7 });
    const dir = [Math.cos(rayAngle), -Math.sin(rayAngle)], nn = [-dir[1], dir[0]];
    [-0.55, 0, 0.55].forEach((k, i) => {
      const a = [sx + dir[0] * (sr + 5) + nn[0] * k * sr, sy + dir[1] * (sr + 5) + nn[1] * k * sr];
      qpath(subj, pathOf([a, [a[0] + dir[0] * C.sunRay, a[1] + dir[1] * C.sunRay]]), { min: 0.5, max: 1.2 * s, seed: 70 + i });
    });
    const bk = [sx + dir[0] * (sr + 5 + C.sunRay + 7), sy + dir[1] * (sr + 5 + C.sunRay + 7)];
    [-3, 3].forEach((k, i) => {
      const c = [bk[0] + dir[0] * k, bk[1] + dir[1] * k];
      qpath(subj, pathOf([[c[0] + nn[0] * sr * 0.8 + dir[0] * 3, c[1] + nn[1] * sr * 0.8 + dir[1] * 3], [c[0] - nn[0] * sr * 0.8 - dir[0] * 3, c[1] - nn[1] * sr * 0.8 - dir[1] * 3]]), { min: 0.5, max: 1.2 * s, seed: 75 + i });
    });
    // D, finished: scattering in the lit air, and a fine line of the light each burst sends down to F.
    C.scatter.forEach(([X, H], i) => {
      const p = m.P(X, R + H);
      const rand = mulberry32(40 + i);
      const k = 8;
      for (let j = 0; j < k; j++) {
        const a = (j / k) * Math.PI * 2 + rand() * 0.45;
        const r1 = C.burst * (0.6 + 0.6 * rand());
        el(subj, 'path', { class: 'ink-fill', d: taper([[p[0] + Math.cos(a) * 2.6, p[1] + Math.sin(a) * 2.6], [p[0] + Math.cos(a) * (2.6 + r1 / 2), p[1] + Math.sin(a) * (2.6 + r1 / 2)], [p[0] + Math.cos(a) * (2.6 + r1), p[1] + Math.sin(a) * (2.6 + r1)]], 1.0, 0.1) });
      }
      el(subj, 'circle', { class: 'ink-fill', cx: f(p[0]), cy: f(p[1]), r: 1.4 });
      const v = [O[0] - p[0], O[1] - p[1]], lv = Math.hypot(...v);
      const a = [p[0] + (v[0] / lv) * (C.burst + 4), p[1] + (v[1] / lv) * (C.burst + 4)], b = [O[0] - (v[0] / lv) * 6, O[1] - 4 - (v[1] / lv) * 6];
      el(subj, 'path', { class: 'ink-fill ink-faint', d: taper([a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], b], 1.1, 0.25) });
    });
    // F at its place: a small eye on the ground, looking up toward the glow.
    const eyeAt = [[O[0] - 7, O[1] - 3], [O[0] - 3, O[1] - 7.5], [O[0] + 3, O[1] - 7.5], [O[0] + 7, O[1] - 3]];
    qpath(subj, smooth(eyeAt), { min: 0.8, max: 1.7, light: [-1, -1], seed: 80 });
    qpath(subj, smooth([[O[0] - 7, O[1] - 3], [O[0], O[1] + 0.5], [O[0] + 7, O[1] - 3]]), { min: 0.6, max: 1.2, side: -1, seed: 81 });
    el(subj, 'circle', { class: 'ink-fill', cx: f(O[0] - 1), cy: f(O[1] - 4.2), r: 1.8 });

    return { svg, C, m, L, dg, O, Tp, over, exitB, hO, d, TOP, rayAngle, nightD, shadowPoly };
  }

  /* ------------------------------------------------------------------ */
  /* H: one dawn in four states, unboxed, on one baseline (the horizon through every F). */
  function sequence(ctx, { x, y, w, gap, S, V, oy, k = 1, caption }) {
    const { L, dg, C } = ctx;
    const g = T.geometry.shadow_height_over_O_km, ob = T.observer, tw = T.twilight;
    const states = [
      { d: tw.astronomical_deg, t: ob.astronomical_twilight_starts, h: g['18'], ord: '1st' },
      { d: tw.nautical_deg, t: ob.nautical_twilight_starts, h: g['12'], ord: '2nd' },
      { d: tw.civil_deg, t: ob.civil_twilight_starts, h: g['6'], ord: '3rd' },
      { d: tw.sunrise_centre_deg, t: ob.sunrise, h: g.sunrise, ord: '4th', up: true },
    ];
    const sat = el(L.ink, 'g', { 'data-satellite': 'H' });
    const base = y + oy;
    el(L.construction, 'path', { class: 'cons', d: `M${f(x - 8)} ${hp(base)}H${f(x + 4 * w + 3 * gap + 8)}` });
    const out = [];
    states.forEach((st, i) => {
      const px = x + i * (w + gap);
      const ox = px + w - 9;
      const m = model({ ox, oy: base, S, V, d: st.d });
      const thA = m.thOf(px), thB = m.thOf(px + w);
      const ground = arc(m, thA, thB);
      const box = [px, y - 10, px + w, y + oy * 2];
      const [lo, hi] = m.clip(0, box);
      const Tq = m.polar(-st.d, 0);
      const a = m.ray(0, lo), b = m.ray(0, hi);
      if (!st.up) {
        const night = [Tq, b, [px + w, b[1]]].concat(arc(m, thB, -st.d));
        const cl = clipTo(dg, `seqn-${C.id}-${i}`, pathOf(night, true));
        el(sat, 'path', { class: 'ink-fill', 'clip-path': cl, d: hatch(bounds(night), { gap: 3.4 * k, weight: 0.7, reach: 0.75, seed: 90 + i, toward: [0.4, 1] }) });
      }
      qpath(sat, pathOf(ground), { min: 0.6, max: 1.6 * k, light: m.toSun, seed: 100 + i });
      qpath(sat, pathOf([a, b]), { min: 0.45, max: 1.05 * k, light: [0, -1], side: -1, seed: 110 + i, step: 2 });
      el(sat, 'circle', { class: 'ink-fill', cx: f(ox), cy: f(base), r: 1.9 * k });
      // the line: the shadow's edge over F, in the same place in every state
      const top = m.P(0, R + st.h);
      if (base - top[1] > 8) { // tall enough to measure; otherwise the edge is at F at this scale, and a ring marks it
        ln(L.line, `M${hp(ox)} ${f(base - 2.5)}V${f(top[1] + 0.4)}`);
        arrow(L.line, [hp(ox), top[1] + 0.4], [hp(ox), base], Math.min(6, base - top[1] - 3));
      } else el(L.line, 'circle', { class: 'ln', cx: f(ox), cy: f(base), r: 4.5 });
      out.push({ px, st, ox, base, m });
      caption(L.notes, px, y + oy * 2, st);
    });
    return out;
  }

  /* G: one molecule of air. The two waves keep their true ratio; the molecule is far smaller than drawn. */
  function molecule(ctx, { x, y, k = 0.075 }) {
    const { L, dg, C } = ctx;
    const sat = el(L.ink, 'g', { 'data-satellite': 'G' });
    const short = T.scattering.shortest_visible_nm, long = T.scattering.longest_visible_nm;
    const wave = (x0, y0, lam, n, amp, ang = 0) => {
      const pts = [];
      const len = lam * k * n;
      for (let i = 0; i <= 24 * n; i++) {
        const s = (i / (24 * n)) * len;
        const yy = -Math.sin((s / (lam * k)) * Math.PI * 2) * amp;
        pts.push([x0 + Math.cos(ang) * s - Math.sin(ang) * yy, y0 + Math.sin(ang) * s + Math.cos(ang) * yy]);
      }
      return pts;
    };
    const mx = x + 128, my = y + 46;
    const sIn = [x, my - 8], lIn = [mx - 14 - long * k * 2, my + 9];
    qpath(sat, pathOf(wave(sIn[0], sIn[1], short, 3, 3)), { min: 0.6, max: 1.5, seed: 120, step: 1.5 });
    qpath(sat, pathOf(wave(lIn[0], lIn[1], long, 2, 3)), { min: 0.6, max: 1.5, seed: 121, step: 1.5 });
    qpath(sat, pathOf(wave(mx + 16, my + 9, long, 2, 3)), { min: 0.5, max: 1.3, seed: 122, step: 1.5 });
    const cl = clipTo(dg, `mol-${C.id}`, circlePath(mx + 4.5, my, 5.5));
    el(sat, 'path', { class: 'ink-fill', 'clip-path': cl, d: hatch([mx - 2, my - 6, 13, 12], { gap: 2.4, weight: 0.65, reach: 0.8, seed: 7 }) });
    qpath(sat, circlePath(mx - 4.5, my, 6), { min: 0.6, max: 1.6, seed: 123 });
    qpath(sat, circlePath(mx + 4.5, my, 6), { min: 0.6, max: 1.6, seed: 124 });
    [-168, -140, -112, -84, -56, -28, 32, 64, 96, 128, 156].forEach((a, i) =>
      qpath(sat, pathOf(wave(mx + Math.cos(a * rad) * 15, my + Math.sin(a * rad) * 15, short, 1, 1.7, a * rad)), { min: 0.4, max: 1.05, seed: 130 + i, step: 1.5 }));
    qpath(sat, pathOf(wave(mx + 15, my - 15, long, 1, 1.7, -12 * rad)), { min: 0.4, max: 1.05, seed: 145, step: 1.5 });
    return { mx, my, k, short, long, sIn, lIn, x, y, amp: 3 };
  }

  /* F: the eye at F, in section, looking east toward the glow. The light it gets comes from the sky. */
  function eyeSection(ctx, { cx, cy, r }) {
    const { L, dg, C } = ctx;
    const sat = el(L.ink, 'g', { 'data-satellite': 'F' });
    const gapA = 34 * rad;
    const look = Math.PI; // east, to the left
    const p0 = [cx + Math.cos(look + gapA) * r, cy + Math.sin(look + gapA) * r];
    const p1 = [cx + Math.cos(look - gapA) * r, cy + Math.sin(look - gapA) * r];
    const cr = r * 0.62;
    const apexOff = r * Math.cos(gapA) + (cr - Math.sqrt(cr * cr - (r * Math.sin(gapA)) ** 2));
    // shade: the crescent away from the upper-left light, hatched from its core
    const sm = el(dg, 'mask', { id: `ball-${C.id}`, maskUnits: 'userSpaceOnUse', x: f(cx - 2 * r), y: f(cy - 2 * r), width: f(4 * r), height: f(4 * r) });
    el(sm, 'circle', { cx: f(cx), cy: f(cy), r: f(r - 2.5), fill: '#fff' });
    el(sm, 'circle', { cx: f(cx - r * 0.3), cy: f(cy - r * 0.32), r: f(r * 0.92), fill: '#000' });
    const hg = el(sat, 'g', { mask: `url(#ball-${C.id})` });
    el(hg, 'path', { class: 'ink-fill', d: hatch([cx - r, cy - r, 2 * r, 2 * r], { gap: 3.2, weight: 0.8, reach: 0.7, seed: 31, toward: [1, 1] }) });
    // sclera, open at the cornea; cornea, more curved
    const sclera = [];
    for (let a = look + gapA - 0.12; a <= look + 2 * Math.PI - gapA + 0.12; a += 0.05) sclera.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    qpath(sat, pathOf(sclera), { min: 0.8, max: 1.9, seed: 150 });
    qpath(sat, `M${f(p1[0] + 1.5)} ${f(p1[1] - 2)}L${f(p1[0])} ${f(p1[1])}A${f(cr)} ${f(cr)} 0 0 1 ${f(p0[0])} ${f(p0[1])}L${f(p0[0] + 1.5)} ${f(p0[1] + 2)}`, { min: 0.6, max: 1.5, seed: 151 });
    // iris either side of the pupil, the lens behind it, the optic nerve leaving the back
    for (const [i, sgn] of [-1, 1].entries()) {
      const a = [cx - r * 0.74, cy + sgn * r * 0.52], b = [cx - r * 0.74, cy + sgn * r * 0.17];
      qpath(sat, pathOf([a, b]), { min: 0.8, max: 1.4, seed: 152 + i });
    }
    const lc = [cx - r * 0.56, cy];
    qpath(sat, circlePath(lc[0], lc[1], r * 0.13, r * 0.3, -60), { min: 0.6, max: 1.3, seed: 154, step: 1.5 });
    for (const [i, sgn] of [-1, 1].entries()) {
      const a = [cx + r * 0.97, cy + sgn * r * 0.17], b = [cx + r * 1.5, cy + sgn * r * 0.21];
      qpath(sat, pathOf([a, b]), { min: 0.7, max: 1.4, seed: 156 + i });
    }
    // scattered light from the lit air above the eastern horizon: through the cornea and lens to the back
    const focus = [cx + r * 0.92, cy + r * 0.3];
    [[-0.3, 1.6], [-0.05, 1.8], [0.2, 1.65]].forEach(([off, len], i) => {
      const enter = [cx - apexOff + 2, cy + off * r];
      const dirIn = [Math.cos(-0.42), Math.sin(-0.42)]; // arriving from up and to the left
      const start = [enter[0] - dirIn[0] * r * len, enter[1] + dirIn[1] * r * len];
      el(sat, 'path', { class: 'ink-fill ink-faint', d: taper([start, enter], 1.0, 0.7) });
      el(sat, 'path', { class: 'ink-fill ink-faint', d: taper([enter, lc, focus], 0.8, 0.35) });
    });
    return { cx, cy, r, apex: [cx - apexOff, cy], back: [cx + r, cy], lc, focus };
  }

  /* ------------------------------------------------------------------ */
  /* Desktop composition */
  const D6 = T.drawing.main_state_deg;
  const dk = T.drawing.desktop;
  const desk = build(document.getElementById('desk'), {
    id: 'd', w: 1440, h: 900,
    section: { ox: 760, oy: 434, S: 1 / dk.km_per_px_horizontal, V: 1 / dk.km_per_px_vertical, d: D6 },
    slice: [-8.0, 5.2],
    horizon: [560, 1010],
    sunLine: 230,
    band: 26, fadeR: 360,
    rays: [0, 7, 14, 21, 28, -2.5],
    beyond: 62,
    sun: [262, 532, 19], sunRay: 21,
    glowDepth: 250,
    scatter: [[0, 66], [36, 86], [-120, 42], [-220, 24], [-334, 10], [-345, 60], [-250, 76]],
    burst: 7.5,
  });

  await document.fonts.ready; // labels, knockouts and leaders to words are measured from real glyphs

  (() => {
    const { L, m, O, Tp, over, hO, d, TOP } = desk;
    const N = L.notes;
    const sq = T.drawing.sequence;
    const seq = sequence(desk, {
      x: 1050, y: 66, w: 70, gap: 8, oy: 32, S: 1 / sq.km_per_px_horizontal, V: 1 / sq.km_per_px_vertical,
      caption: (g, px, yb, st) => note(g, px, yb + 14, [`${st.ord} · ${st.t}`, st.up ? 'sunrise' : `${st.h.toFixed(0)} km`], { cls: 'note-xs', lh: 16 }),
    });
    const mol = molecule(desk, { x: 1050, y: 248 });
    const eye = eyeSection(desk, { cx: 760, cy: 652, r: 40 });

    /* letters */
    letter(L, desk.C.sun[0] - desk.C.sun[2] - 12, desk.C.sun[1] + 6, 'A', 'end');
    leadLetter(L, 'B', m.atX(0, 446), { dy: -44, side: -1, end: 'arrow' });
    leadLetter(L, 'E', unshift(onHatch(desk.nightD, m.P(430, R + 24), desk.shadowPoly)), { dy: -22, side: 1, crop: true });
    letter(L, O[0] + 14, O[1] - 13, 'F');
    letter(L, eye.cx + eye.r + 18, eye.cy - eye.r + 4, 'F');
    letter(L, mol.mx + 32, mol.my - 30, 'G');
    letter(L, seq[0].px - 14, seq[0].base - 8, 'H', 'end');

    /* D: the one selection, the lit air straight over F, its bottom kept 7 u clear of B at the right corner */
    const topY = m.P(0, R + TOP)[1];
    const half = 34, bRight = m.atX(0, O[0] + half)[1];
    const sel = { x: Math.round(O[0] - half), y: Math.round(topY + 7), w: 2 * half, h: Math.round(bRight - 7 - (topY + 7)) };
    el(L.line, 'rect', { class: 'ln', x: sel.x + 0.5, y: sel.y + 0.5, width: sel.w, height: sel.h });
    for (const [hx, hy] of [[sel.x, sel.y], [sel.x + sel.w, sel.y], [sel.x, sel.y + sel.h], [sel.x + sel.w, sel.y + sel.h]]) handle(L.line, hx + 0.5, hy + 0.5);
    const labs = el(L.line, 'g');
    label(labs, sel.x - 9, sel.y + 14, 'LIT AIR', { cls: 'tag', anchor: 'end' });
    label(labs, sel.x - 9, sel.y + 30, `${hO.toFixed(0)}–${TOP} km`, { anchor: 'end' });
    letter(L, sel.x - 9, sel.y + 60, 'D', 'end');

    /* 35 km over F: extension lines 3 u clear of the ink, 8 u past the dimension line */
    const dx = Math.round(O[0] + 92);
    ln(L.line, `M${f(O[0] + 10)} ${hp(O[1])}H${f(hp(dx) + 8.7)}`, { 'data-ext': true });
    ln(L.line, `M${f(over[0] + 4)} ${hp(over[1])}H${f(hp(dx) + 8.7)}`, { 'data-ext': true, 'data-crop': true });
    ln(L.line, `M${hp(dx)} ${hp(O[1])}V${hp(over[1])}`);
    label(labs, dx + 6, (O[1] + over[1]) / 2 + 4, `${hO.toFixed(0)} km`);

    /* 6° between F's horizon and the line to the sun; drawn steeper, so underlined */
    const r6 = 66;
    const a6 = Math.atan2(m.toSun[1], -m.toSun[0]);
    const pA = [O[0] - r6, hp(O[1]) - SHIFT[1]], pB = [O[0] + m.toSun[0] * r6, O[1] + m.toSun[1] * r6];
    ln(L.line, `M${f(pA[0])} ${f(pA[1])}A${r6} ${r6} 0 0 0 ${f(pB[0])} ${f(pB[1])}`, { 'data-crop': true });
    label(labs, O[0] - r6 - 8, O[1] - 7, `${d}°`, { nts: true, anchor: 'end' });

    /* 667 km along the ground from F to C: an arc dimension under the crust, radial extension lines */
    const off = -(desk.C.band + 18) / m.V;
    ln(L.line, pathOf(arc(m, -d, 0, off)));
    for (const th of [-d, 0]) ln(L.line, pathOf([unshift(m.polar(th, -6 / m.V)), m.polar(th, off - 10 / m.V)]), { 'data-ext': true, 'data-crop': th === -d || null });
    const mid = m.polar(-d / 2, off);
    label(labs, mid[0], mid[1] + 17, `${T.geometry.ground_distance_O_to_T_km['6']} km`, { anchor: 'middle' });
    const cFoot = m.polar(-d, off - 10 / m.V);
    letter(L, cFoot[0] - 3, cFoot[1] + 6, 'C', 'end');

    /* G: the two wavelengths, each with extension lines down to its wave; the count as tally ticks */
    const k = mol.k;
    const sTop = mol.sIn[1] - mol.amp, sDim = sTop - 14;
    const sA = mol.sIn[0] + mol.short * k * 0.25, sB = sA + mol.short * k; // crest to crest
    for (const xx of [sA, sB]) ln(L.line, `M${f(xx - SHIFT[0])} ${f(sTop - 6 - SHIFT[1])}V${f(hp(sDim) - 8.7)}`, { 'data-ext': true, 'data-crop': xx === sA || null });
    ln(L.line, `M${f(sA - SHIFT[0])} ${hp(sDim)}H${f(sB - SHIFT[0])}`);
    label(labs, sA, sDim - 11, `${mol.short} nm`);
    const lBot = mol.lIn[1] + mol.amp, lDim = lBot + 14;
    const lA = mol.lIn[0] + mol.long * k * 0.75, lB = lA + mol.long * k;
    for (const xx of [lA, lB]) ln(L.line, `M${f(xx - SHIFT[0])} ${f(lBot + 6 - SHIFT[1])}V${f(hp(lDim) + 8.7)}`, { 'data-ext': true });
    ln(L.line, `M${f(lA - SHIFT[0])} ${hp(lDim)}H${f(lB - SHIFT[0])}`);
    label(labs, lA, lDim + 20, `${mol.long} nm`);
    const tx = mol.mx + 34, ty = lDim + 20;
    for (let i = 0; i < 12; i++) el(L.line, 'rect', { class: 'ln-dot', x: Math.round(tx + i * 4), y: f(ty - (i === 11 ? 4.5 : 9)), width: 1, height: i === 11 ? 4.5 : 9 });
    label(labs, tx + 52, ty, `${T.scattering.ratio_short_to_long} : 1`);

    /* F: the eye's 24 mm, cornea to back, with extension lines down from the drawn ink */
    const eDim = eye.cy + eye.r + 18;
    ln(L.line, `M${f(eye.apex[0] - SHIFT[0])} ${f(eye.cy + 6 - SHIFT[1])}V${f(hp(eDim) + 8.7)}`, { 'data-ext': true, 'data-crop': true });
    ln(L.line, `M${f(eye.back[0] - SHIFT[0])} ${f(eye.cy + 6 - SHIFT[1])}V${f(hp(eDim) + 8.7)}`, { 'data-ext': true });
    ln(L.line, `M${f(eye.apex[0] - SHIFT[0])} ${hp(eDim)}H${f(eye.back[0] - SHIFT[0])}`);
    label(labs, (eye.apex[0] + eye.back[0]) / 2 - SHIFT[0], eDim + 16, `${T.eye.axial_length_mm} mm`, { anchor: 'middle' });

    /* frame: scale bars and register crosses */
    const sbY = 858, sbX = 1100;
    const kmH = 500, pxH = kmH * m.S, kmV = 20, pxV = kmV * m.V, vx = 1350;
    ln(L.line, `M${sbX} ${hp(sbY)}H${f(sbX + pxH)}`, { 'data-free': true });
    for (let i = 0; i <= 5; i++) ln(L.line, `M${hp(sbX + (pxH * i) / 5)} ${sbY - (i % 5 ? 3 : 6)}V${sbY}`, { 'data-free': true });
    ln(L.line, `M${hp(vx)} ${sbY}V${f(sbY - pxV)}`, { 'data-free': true });
    for (let i = 0; i <= 4; i++) ln(L.line, `M${vx - (i % 4 ? 3 : 6)} ${hp(sbY - (pxV * i) / 4)}H${vx}`, { 'data-free': true });
    cross(L.line, 40, 40);
    cross(L.line, 1400, 860);
    knock(labs);

    /* notes, on the column guides */
    el(N, 'text', { class: 'plate-no', x: 104, y: 78 }, `Plate ${T.plate.number}`);
    el(N, 'text', { class: 'title', x: 101, y: 128 }, 'The light');
    el(N, 'text', { class: 'title', x: 101, y: 176 }, 'before the sun');
    note(N, 104, 232, [
      '**D** — The lit air. At ' + T.observer.civil_twilight_starts + ' the sun is',
      'still below the horizon at **F**, yet over',
      '**F** all the air from ' + hO.toFixed(0) + ' km up is in',
      'sunlight. Only ' + T.atmosphere.share_above_35km_percent + '% of the air is that',
      'high, but enough to light the sky. Past',
      'the air the light goes on unseen: there',
      'is nothing left up there to scatter it.',
    ]);
    note(N, 104, 412, [
      '**B** — The grazing ray, the last sunlight',
      'to clear the Earth’s curve. It touches',
      'the ground at **C**, ' + T.geometry.ground_distance_O_to_T_km['6'] + ' km east, where',
      'the sun stands on the horizon now.',
    ]);
    note(N, 104, 606, [
      '**A** — The sun, ' + d + '° below the horizon at **F**',
      'and ' + T.observer.sun_distance_million_km + ' million km off, drawn here only',
      'to show where the light comes from.',
    ]);
    note(N, 1050, 196, ['**H** — One dawn, ' + T.observer.place + ', 20 October 2026:', 'as the sun climbs, the shadow over **F** sinks. Heights ×' + sq.heights_exaggerated + '.'], { cls: 'note-xs', lh: 17 });
    note(N, 1050, 388, [
      '**G** — Air throws light every way,',
      'short waves far more than long:',
      'the shortest we see, about ' + T.scattering.ratio_short_to_long + '×',
      'as often as the longest. (The',
      'molecule is not drawn to scale.)',
    ]);
    note(N, 852, 638, [
      '**F** — The eye, enlarged. It gets no',
      'direct sun: all the light it takes in',
      'was thrown down to it by the air.',
    ]);
    note(N, 1050, 542, [
      '**E** — The Earth’s shadow: under',
      'the ray it is still night. From **F** it',
      'is a blue-grey band in the west.',
    ]);
    el(N, 'text', { class: 'colophon', x: sbX, y: 878 }, '0');
    el(N, 'text', { class: 'colophon', x: f(sbX + pxH), y: 878, 'text-anchor': 'end' }, `${kmH} km`);
    el(N, 'text', { class: 'colophon', x: vx - 10, y: f(sbY - pxV + 4), 'text-anchor': 'end' }, `${kmV} km`);
    el(N, 'text', { class: 'colophon', x: 1352, y: 894, 'text-anchor': 'end' }, 'kiruk · 20 October 2026');
    el(N, 'text', { class: 'colophon', x: 104, y: 866 }, 'Section through F along the sun’s bearing, seen from the north: east is on the left.');
    el(N, 'text', { class: 'colophon', x: 104, y: 883 }, `Heights are drawn ×${(m.V / m.S).toFixed(1)} against distances, so angles look steeper: an underlined value is not to scale.`);
    for (const [x0, y0, y1] of [[100, 212, 392], [100, 392, 490], [100, 586, 674], [1046, 368, 488], [848, 618, 694], [1046, 522, 600], [1046, 180, 216]])
      el(L.construction, 'path', { class: 'cons', d: `M${x0 + 0.5} ${y0}V${y1}` });

    el(desk.svg, 'use', { 'data-eye': true, href: '#logogram-d', x: 1318, y: 30, width: 24, height: 24 });
  })();

  /* Phone: the subject and H, recomposed for 390 px; the claim sits under the drawing as words. */
  const pk = T.drawing.phone;
  const phone = build(document.getElementById('phone'), {
    id: 'p', w: 390, h: 720, scale: 0.92,
    section: { ox: 240, oy: 380, S: 1 / pk.km_per_px_horizontal, V: 1 / pk.km_per_px_vertical, d: D6 },
    slice: [-7.0, 4.4],
    horizon: [150, 350],
    sunLine: 110,
    band: 18, fadeR: 180,
    rays: [0, 8, 16, 24],
    beyond: 40,
    sun: [86, 516, 12], sunRay: 13,
    glowDepth: 130,
    scatter: [[0, 64], [-190, 28], [-300, 10]],
    burst: 6,
  });
  (() => {
    const { L, m, O, Tp, over, hO, d, TOP } = phone;
    const N = L.notes;
    const sq = T.drawing.sequence_phone;
    const seq = sequence(phone, {
      x: 26, y: 112, w: 76, gap: 10, oy: 30, k: 0.95, S: 1 / sq.km_per_px_horizontal, V: 1 / sq.km_per_px_vertical,
      caption: (g, px, yb, st) => el(g, 'text', { class: 'note-xs', x: px, y: f(yb + 14) }, st.t),
    });
    letter(L, phone.C.sun[0] + phone.C.sun[2] + 10, phone.C.sun[1] + 6, 'A');
    leadLetter(L, 'B', m.atX(0, 94), { dy: -30, side: -1, end: 'arrow', sh: 12 });
    leadLetter(L, 'C', [Tp[0], Tp[1] + 1.2], { dy: 44, side: -1, vertical: true, end: 'arrow', sh: 12 });
    leadLetter(L, 'E', unshift(onHatch(phone.nightD, m.P(470, R + 10), phone.shadowPoly)), { dy: 76, side: -1, vertical: true, sh: 12, crop: true });
    leadLetter(L, 'F', [O[0] + 5, O[1] + 1], { dy: 54, side: -1, vertical: true, end: 'arrow', sh: 12 });
    letter(L, seq[0].px, seq[0].base - 22, 'H');
    const topY = m.P(0, R + TOP)[1];
    const half = 32, bRight = m.atX(0, O[0] + half)[1];
    const sel = { x: Math.round(O[0] - half), y: Math.round(topY + 6), w: 2 * half, h: Math.round(bRight - 7 - (topY + 6)) };
    el(L.line, 'rect', { class: 'ln', x: sel.x + 0.5, y: sel.y + 0.5, width: sel.w, height: sel.h });
    for (const [hx, hy] of [[sel.x, sel.y], [sel.x + sel.w, sel.y], [sel.x, sel.y + sel.h], [sel.x + sel.w, sel.y + sel.h]]) handle(L.line, hx + 0.5, hy + 0.5);
    const labs = el(L.line, 'g');
    label(labs, sel.x - 7, sel.y + 14, 'LIT AIR', { cls: 'tag', anchor: 'end' });
    letter(L, sel.x - 7, sel.y + 40, 'D', 'end');
    const dx = Math.round(O[0] + 56);
    ln(L.line, `M${f(O[0] + 10)} ${hp(O[1])}H${f(hp(dx) + 8.7)}`, { 'data-ext': true });
    ln(L.line, `M${f(over[0] + 4)} ${hp(over[1])}H${f(hp(dx) + 8.7)}`, { 'data-ext': true });
    ln(L.line, `M${hp(dx)} ${hp(O[1])}V${hp(over[1])}`);
    label(labs, dx + 5, (O[1] + over[1]) / 2 + 4, `${hO.toFixed(0)} km`);
    const r6 = 44;
    const pA = [O[0] - r6, hp(O[1]) - SHIFT[1]], pB = [O[0] + m.toSun[0] * r6, O[1] + m.toSun[1] * r6];
    ln(L.line, `M${f(pA[0])} ${f(pA[1])}A${r6} ${r6} 0 0 0 ${f(pB[0])} ${f(pB[1])}`);
    label(labs, O[0] - r6 - 6, O[1] - 6, `${d}°`, { nts: true, anchor: 'end' });
    const off = -(phone.C.band + 14) / m.V;
    ln(L.line, pathOf(arc(m, -d, 0, off)));
    for (const th of [-d, 0]) ln(L.line, pathOf([unshift(m.polar(th, -6 / m.V)), m.polar(th, off - 10 / m.V)]), { 'data-ext': true });
    const mid = m.polar(-d / 2, off);
    label(labs, mid[0], mid[1] + 16, `${T.geometry.ground_distance_O_to_T_km['6']} km`, { anchor: 'middle' });
    cross(L.line, 12, 12);
    cross(L.line, 378, 708);
    knock(labs);
    el(N, 'text', { class: 'plate-no', x: 26, y: 48 }, `Plate ${T.plate.number}`);
    el(N, 'text', { class: 'title', x: 25, y: 88, style: 'font-size:32px' }, T.plate.title);
    note(N, 26, 596, ['The sky lights up before sunrise:', 'sunlight the Earth still hides from', 'you already reaches the air high', 'above, and the air scatters it down.'], { cls: 'claim-svg', lh: 21 });
    el(N, 'text', { class: 'colophon', x: 26, y: 692 }, `heights ×${(m.V / m.S).toFixed(1)} · east is left`);
    el(N, 'text', { class: 'colophon', x: 364, y: 692, 'text-anchor': 'end' }, 'kiruk · 2026');
    el(phone.svg, 'use', { 'data-eye': true, href: '#logogram-p', x: 340, y: 28, width: 24, height: 24 });
  })();
  document.documentElement.dataset.plateReady = '';
})();
</script>
