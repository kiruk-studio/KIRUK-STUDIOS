<title>Plate II · The anatomy of the logogram · kiruk codex</title>
<!--
  kiruk codex · Plate II · the anatomy of the kiruk logogram as a layer stack.
  spec-link: .claude/skills/kiruk-codex/SKILL.md (figure contract), references/marks.md (the mark plate),
             references/depth.md, references/live.md. Truth: ./truth.json (embedded below as #truth).
  The logogram's path data is copied unchanged from apps/kiruk-web/public/favicon.svg into the sprite below.
  It is grouped (needles, body, spears) for rigging only, never redrawn, smoothed, filtered or restyled.
  Draft colours are CSS variables; they become tokens through a spec before anything ships (non-negotiable 5).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@500&family=Xanh+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe4d4;
    --ink: #2a2226;
    --ink-soft: rgb(42 34 38 / 0.55);
    --construction: #5d4f55;
    --rubric: #b5462b;
    --rubric-text: #983a22;
    --rubric-tint: rgb(181 70 43 / 0.55);
    --haze: #c9d0d6;
    --ground-top: #d7dcdf;
    --ground-mid: #e2ded6;
    --ground-low: #ead9bf;
    --page: #e9e2d6;
  }
  * { box-sizing: border-box; }
  html { font-synthesis: none; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.45 'IM Fell English', Georgia, serif; }
  main { max-width: 1440px; margin: 0 auto; }
  figure[data-codex] { margin: 0; position: relative; }
  .sheet svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  /* taps and drags go to the sheets; the red, the letters and the words never catch the pointer */
  .sheet svg [data-layer="line"], .sheet svg [data-layer="letters"], .sheet svg [data-layer="notes"] { pointer-events: none; }
  .sheet svg:focus-visible { outline: 2px solid var(--rubric); outline-offset: -2px; }
  .sheet.phone { display: none; }
  @media (max-width: 760px) {
    .sheet.desk { display: none; }
    .sheet.phone { display: block; }
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* svg type: three voices (type.md) */
  svg text { font-family: 'IM Fell English', serif; fill: var(--ink); }
  .t-note { font-size: 16px; }
  .t-word { font-style: italic; font-size: 16px; }
  .t-sc { font-family: 'IM Fell English SC', serif; letter-spacing: 0.08em; }
  .t-name { font-family: 'IM Fell English SC', serif; letter-spacing: 0.08em; font-size: 15px; }
  .t-title { font-family: 'IM Fell Double Pica', serif; font-size: 44px; }
  .t-pn { font-family: 'IM Fell English SC', serif; letter-spacing: 0.08em; font-size: 16px; }
  .t-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 12px; fill: var(--rubric-text); font-variant-numeric: tabular-nums; }
  .t-mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; fill: var(--ink); }
  .t-letter { font-family: 'IM Fell English', serif; font-size: 16px; fill: var(--rubric-text); }
  .phone .t-name { font-size: 13px; }
  .phone .t-letter { font-size: 14px; }
  .phone .t-pn { font-size: 14px; }
  .phone .t-mono { font-size: 11.6px; }

  /* the modern line (line.md) */
  .ln { fill: none; stroke: var(--rubric); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linecap: butt; }
  .ln.tint { stroke: var(--rubric-tint); }
  .ln.chain { stroke-dasharray: 24 3 1 3; }
  .ln.dash { stroke-dasharray: 12 3; }
  .end { fill: var(--rubric); stroke: none; }
  .ko { fill: var(--paper); stroke: var(--rubric); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ko.bare { stroke: none; }
  .cons { fill: none; stroke: var(--construction); stroke-opacity: 0.4; stroke-width: 0.6; }
  .cons.hid { stroke-dasharray: 12 3; stroke-opacity: 0.55; }
  .sheet-fill { fill: var(--paper); }

  .plane { outline: none; cursor: grab; }
  .plane:focus-visible .contour path { stroke: var(--rubric); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .dragging .plane { cursor: grabbing; }
  [hidden], .off { display: none; }

  /* html under the sheet */
  .under { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px 64px; padding: 22px 86px 40px; align-items: start; }
  figcaption { grid-column: 1; grid-row: 1; }
  .controls { grid-column: 1; grid-row: 2; }
  .key-wrap { grid-column: 2; grid-row: 1 / span 3; }
  .html-notes { grid-column: 1 / -1; }
  figcaption .pn, figcaption .ttl { display: none; }
  .claim { font-family: 'Xanh Mono', monospace; font-size: 16px; line-height: 1.4; max-width: 62ch; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; font: 500 12px/1.4 'JetBrains Mono', monospace; color: var(--ink); }
  .controls label { display: inline-flex; gap: 10px; align-items: center; }
  .controls input[type=range] { width: 160px; accent-color: var(--ink); }
  .controls .hint { color: var(--ink); }
  .key { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 32px; }
  .key li { break-inside: avoid; margin: 0 0 6px; }
  .key button { all: unset; cursor: pointer; display: block; }
  .key button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
  .key b { font-weight: normal; color: var(--rubric-text); display: inline-block; width: 1.4em; }
  .key q { font-style: italic; }
  .html-notes { display: none; }
  .html-notes h3 { font: 15px/1.3 'IM Fell English SC', serif; letter-spacing: 0.08em; margin: 14px 0 2px; font-weight: normal; }
  .html-notes p { margin: 0; }
  h2.k { font: 15px/1.3 'IM Fell English SC', serif; letter-spacing: 0.08em; margin: 0 0 6px; font-weight: normal; grid-column: 1 / -1; }
  @media (max-width: 760px) {
    .under { grid-template-columns: 1fr; padding: 12px 16px 32px; }
    figcaption, .controls, .key-wrap, .html-notes { grid-column: 1; grid-row: auto; }
    figcaption .pn, figcaption .ttl { display: block; }
    figcaption .pn { font: 15px 'IM Fell English SC', serif; letter-spacing: 0.08em; }
    figcaption .ttl { font: 32px/1.05 'IM Fell Double Pica', serif; margin: 2px 0 8px; text-wrap: balance; }
    .html-notes { display: block; }
    .key { columns: 1; }
    .controls input[type=range] { width: 130px; }
  }
</style>

// ---------- the mark's own geometry (truth.json) ----------
const LENS = { R: 551.4, up: 1271.4, low: 728.6 }; // the eye: two arcs through the four points

const markAt = (S) => { const s = S / 1000; return (X, Y) => [S / 2 + (X - 1000) * s, S / 2 + (Y - 1000) * s]; };

// ---------- sheets ----------
const SHEETS = {

// line-layer primitives

const dot = (g, p) => el('circle', { cx: f1(p[0]), cy: f1(p[1]), r: 2.5, class: 'end', 'data-end': '' }, g);
const snap = (pts) => pts.map((p, i) => { // half-pixel snap across axis-aligned segments only (line.md)
  const q = [...p]; const prev = pts[i - 1], next = pts[i + 1];

function build(C) {

  PLANES.forEach((name, k) => {
    const g = el('g', { class: 'plane', 'data-plane': name, 'data-k': k, 'data-depth': 4 - k }, stack);
    // 1 · cast shadow of this plane on whatever lies under it (light from the upper left)

    // 2 · the sheet (wash), hazed by depth

    el('rect', { x: 0, y: 0, width: S, height: S }, own);

// ---------- one builder per aspect (marks.md) ----------
const ASPECT = {
  concept({ C, S, m, ink, letters, line, notes }) {

      { w: '‘the right direction’', at: m(783.2, 1219.8), kind: 'arrow' },
    ];
    words.forEach((o, i) => {
      const id = `concept-word-${i}`;

      if (o.via) { start = [-14, o.at[1] - 13]; pts = [start, [2, start[1]], o.at]; }
      else { start = [-14, o.at[1]]; pts = [start, o.at]; }

  form({ C, S, m, s, cons, ink, letters, line }) {

    arrow(ug, p0, [p0[0] + side * 4, p0[1] - 0.2]);

  line({ C, S, m, ink, letters, line }) {

// ---------- satellites ----------
function trueSize(parent, cx, cy, N, unit) { // the favicon at N css px, kept true by counter-scaling (see fit())
  const g = el('g', { class: 'true-size', 'data-cx': cx, 'data-cy': cy, 'data-unit': unit }, parent);
  el('use', { href: '#logogram', x: f1(cx - N / 2), y: f1(cy - N / 2), width: N, height: N, style: 'color: var(--ink)', 'data-eye': '' }, g);
  return g;
}
function pixelBlock(C, parent, line, x, y, k, rows, N = 16) { // the N px raster, enlarged × k, rows of the mark only
  const g = el('g', { class: 'pixels', 'data-n': N }, parent);
  const cells = RASTER(N);
  for (let r = rows[0]; r <= rows[1]; r++) for (let q = 0; q < N; q++) {
    const a = cells[r * N + q];
    if (a > 0.01) el('rect', { x: x + q * k, y: y + (r - rows[0]) * k, width: k, height: k, fill: 'var(--ink)', 'fill-opacity': a.toFixed(3) }, g);
  }

  el('rect', { x: x + 0.5, y: y + 0.5, width: W - 1, height: H - 1, class: 'ln tint' }, lg);

  for (let q = 1; q < N; q++) d += `M${x + q * k + 0.5} ${y + 0.5}V${y + H - 0.5}`;
  for (let r = 1; r <= rows[1] - rows[0]; r++) d += `M${x + 0.5} ${y + r * k + 0.5}H${x + W - 0.5}`;

  if (RASTERS[N]) return RASTERS[N];
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const g = cv.getContext('2d');
  const k = N / 1000;
  g.setTransform(k, 0, 0, k, -500 * k, -500 * k);

  for (const p of document.querySelectorAll('#lg-body path, #lg-spears path')) g.fill(new Path2D(p.getAttribute('d')));

  g.beginPath(); g.arc(1000, 1000, 60, 0, Math.PI * 2); g.fill();

  for (let i = 0; i < N * N; i++) out[i] = data[i * 4 + 3] / 255;
  return (RASTERS[N] = out);
}

    svg.addEventListener('pointermove', (ev) => {
      if (!drag) return;
      const dy = ev.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) < 5) return;
      if (!drag.moved) { drag.moved = true; svg.classList.add('dragging'); state.focus = null; }
      followTo(drag.open - dy / (4 * C.dy * drag.scale));
    });
    const end = () => {
      if (!drag) return;
      svg.classList.remove('dragging');
      if (!drag.moved) { goTo({ focus: drag.plane && state.focus !== drag.plane ? drag.plane : null }); }
      else followTo(target > 0.5 ? (target > 0.97 ? 1 : target) : (target < 0.03 ? 0 : target));
      drag = null;
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('keydown', (ev) => {
      const k = ev.key;
      if (k === 'ArrowUp') { goTo({ open: Math.min(1, Math.round(state.open * 4 + 1) / 4) }); }
      else if (k === 'ArrowDown') { goTo({ open: Math.max(0, Math.round(state.open * 4 - 1) / 4) }); }
      else if (k === 'ArrowRight') { goTo({ size: SIZES[Math.min(3, SIZES.indexOf(state.size) + 1)] }); }
      else if (k === 'ArrowLeft') { goTo({ size: SIZES[Math.max(0, SIZES.indexOf(state.size) - 1)] }); }
      else if (k === 'Enter' || k === ' ') { goTo({ open: state.open > 0.5 ? 0 : 1 }); }
      else if (k === 'Home') { goTo({ open: 1, focus: null, size: 256 }); }
      else if (k === 'Escape') { goTo({ focus: null }); document.activeElement?.blur(); }
      else if (/^[1-5]$/.test(k)) { const p = PLANES[+k - 1]; goTo({ focus: state.focus === p ? null : p }); }
      else return;
      ev.preventDefault();
    });
  }
  ctlOpen.addEventListener('input', () => { state.focus = null; followTo(ctlOpen.value / 100); });
  ctlSize.addEventListener('input', () => goTo({ size: SIZES[+ctlSize.value] }));
  // the key: a part's letter brings its plane forward
  const partPlane = { A: 'scale', B: 'line', C: 'scale', D: 'scale', E: 'scale', F: 'concept', G: 'form', H: null };
  for (const b of document.querySelectorAll('#key button')) {
    const on = () => goTo({ focus: partPlane[b.dataset.part] });
    b.addEventListener('mouseenter', on); b.addEventListener('focus', on); b.addEventListener('click', on);
  }
  addEventListener('resize', () => { sheets.forEach(fit); render(); });
  sheets.forEach(fit);
  render();
}

// the states contract (live.md): names[0] is the rest state
const STATES = {
  rest: { open: 1, focus: null, size: 256 },
  closed: { open: 0, focus: null, size: 256 },
  half: { open: 0.5, focus: null, size: 256 },
  'focus-concept': { open: 1, focus: 'concept', size: 256 },
  'focus-form': { open: 1, focus: 'form', size: 256 },
  'focus-line': { open: 1, focus: 'line', size: 256 },
  'focus-colour': { open: 1, focus: 'colour', size: 256 },
  'focus-scale': { open: 1, focus: 'scale', size: 256 },
  'size-64': { open: 1, focus: null, size: 64 },
  'size-32': { open: 1, focus: null, size: 32 },
  'size-16': { open: 1, focus: null, size: 16 },
};
window.codexStates = {
  names: Object.keys(STATES),
  set: async (name) => {
    cancelAnimationFrame(anim); cancelAnimationFrame(follow); follow = null;
    Object.assign(state, STATES[name]);
    render();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  },
};

document.fonts.ready.then(() => {
  if (!document.documentElement.hasAttribute('data-baked')) for (const C of Object.values(SHEETS)) build(C);
  wire();
});
})();
</script>
</body>
</html>
